[project]
name = "agoramesh-backend"
version = "0.1.0"
description = "AgoraMesh Backend API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.3",
]

[tool.ruff]
target-version = "py313"
line-length = 88
